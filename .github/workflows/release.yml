name: Release

# Jalan otomatis waktu lu push tag, contoh:
#   git tag v0.1.0-neoforge
#   git push origin v0.1.0-neoforge
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag buat release ini (contoh: v0.1.0-neoforge)'
        required: true

permissions:
  contents: write   # wajib, ini yang bikin GitHub Release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Resolve version
        id: vars
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: ${{ steps.vars.outputs.tag }}
          draft: false
          prerelease: ${{ contains(steps.vars.outputs.tag, 'beta') || contains(steps.vars.outputs.tag, 'alpha') }}
          generate_release_notes: true
          files: |
            build/libs/*.jar
            !build/libs/*-sources.jar
